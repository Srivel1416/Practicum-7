<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Image Gallery</title>
<style>
* {
}
box-sizing: border-box;
body {
margin: 0;
padding: 30px;
font-family: Arial, sans-serif;
background-color: #f0f5fa;
}
.container {
display: flex;
justify-content: center;
align-items: center;
gap: 40px;
max-width: 1100px;
margin: auto;
}
h2 {
text-align: center;
color: #444;
font-size: 22px;
margin-bottom: 15px;
}
<* Desktop Gallery </
.gallery {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 12px;
}
.gallery img {
width: 100%;
height: 100px;
object-fit: cover;
border: 3px solid white;
}
<* Mobile Phone </
.phone {
width: 170px;
height: 350px;
background: #111;
border: 5px solid #222;
border-radius: 25px;
padding: 15px 7px;
}
.screen {
height: 100%;
background: white;
border-radius: 8px;
padding: 5px;
overflow: hidden;

}
.mobile-gallery {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 5px;
}
.mobile-gallery img {
width: 100%;
height: 63px;
object-fit: cover;
}
<* Responsive Design </
@media (max-width: 650px) {
body {
padding: 15px;
}
.container {
flex-direction: column;
}
.gallery {
grid-template-columns: repeat(2, 1fr);
}
.phone {
display: none;
}
}
</style>
</head>
<body>
<div class="container">
<<<- Desktop Image Gallery <<>
<div class="desktop">
<h2>RESPONSIVE IMAGE GALLERY</h2>
<div class="gallery">
<img src="img1.jpg" alt="Gallery Image 1">
<img src="img2.jpg" alt="Gallery Image 2">
<img src="img3.jpg" alt="Gallery Image 3">
<img src="img4.jpg" alt="Gallery Image 4">
<img src="img5.jpg" alt="Gallery Image 5">
<img src="img6.jpg" alt="Gallery Image 6">
<img src="img7.jpg" alt="Gallery Image 7">
<img src="img8.jpg" alt="Gallery Image 8">
</div>
</div>
<<<- Mobile Phone Preview <<>
<div class="phone">
<div class="screen">
<div class="mobile-gallery">
<img src="img1.jpg" alt="Gallery Image 1">
<img src="img2.jpg" alt="Gallery Image 2">
<img src="img3.jpg" alt="Gallery Image 3">
<img src="img4.jpg" alt="Gallery Image 4">
<img src="img5.jpg" alt="Gallery Image 5">
<img src="img6.jpg" alt="Gallery Image 6">
<img src="img7.jpg" alt="Gallery Image 7">
<img src="img8.jpg" alt="Gallery Image 8">
</div>
</div>
</div>
</div>
</body>
</html
